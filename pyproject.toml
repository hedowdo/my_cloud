[project]
name = "personal-cloud-api"
version = "0.1.0"
description = "Private shared storage API — local foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=25.1,<27",
  "email-validator>=2.2,<3",
  "alembic>=1.15,<2",
  "python-multipart>=0.0.26,<0.1",
  "pillow>=12.3,<14",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3", "pre-commit>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
